worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;

        location / {
            include fastcgi_params;
            fastcgi_pass my_server:81;
        }
        location /status {
            stub_status;
        }
    }
}
